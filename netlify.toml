[build]
  publish = "."

[[headers]]
  for = "/stats.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "https://www.kanefromthelane.com/*"
  to = "https://kanefromthelane.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
